<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retorno do pagamento — Taty Larios</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" href="assets/img/logo.svg">
</head>
<body>
<header class="header">
  <div class="header__bar wrap">
    <span class="header__burger" aria-hidden="true"></span>
    <a class="header__logo" href="index.html" style="grid-column:2"><img src="assets/img/logo.svg" alt="Taty Larios"></a>
    <span class="header__cart" aria-hidden="true"></span>
  </div>
</header>

<main class="wrap" style="min-height:52vh;display:flex;align-items:center;justify-content:center;text-align:center">
  <div style="max-width:520px;padding:64px 0">
    <p class="eyebrow" data-eyebrow>Pagamento</p>
    <h1 data-title>Obrigada!</h1>
    <p data-message style="color:var(--ink-soft)">Estamos confirmando o status do seu pedido.</p>
    <p style="margin-top:28px"><a class="btn" href="index.html">Voltar à loja</a></p>
  </div>
</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/store.js"></script>
<script>
  // TODO: confirmar status real via webhook/consulta. Aqui só lê o querystring.
  var status = new URLSearchParams(location.search).get("status") || "";
  var map = {
    sucesso:  ["Pedido recebido", "Pagamento aprovado ou em processamento. Você receberá a confirmação por e-mail e WhatsApp.", true],
    pendente: ["Pagamento pendente", "Assim que o pagamento for compensado (boleto/Pix), começamos a preparar sua bolsa.", false],
    falha:    ["Não foi dessa vez", "O pagamento não foi concluído. Você pode tentar novamente ou falar com a gente no WhatsApp.", false],
  };
  var m = map[status] || ["Obrigada!", "Estamos confirmando o status do seu pedido.", false];
  document.querySelector("[data-title]").textContent = m[0];
  document.querySelector("[data-message]").textContent = m[1];
  if (m[2] && window.TLStore) TLStore.clearCart();
</script>
</body>
</html>
