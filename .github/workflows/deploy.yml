# Publica o site estático (raiz do repo) no GitHub Pages.
# A pasta api/ é ignorada aqui — ela vai para o Cloudflare Workers separadamente.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Empacotar site (sem a pasta api/)
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude 'api' --exclude '_site' --exclude '.github' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
