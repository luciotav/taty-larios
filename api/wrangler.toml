name = "taty-larios-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Origens permitidas (CORS). Lista separada por vírgula: domínio próprio + www + o github.io
# (mantido durante a migração de DNS; pode remover o github.io depois que o domínio estabilizar).
# PAGES_ORIGIN: base pública de onde o Worker lê data/products.json e para onde manda as back_urls
# do Checkout Pro. Trocar para https://tatianelarios.com.br quando o DNS do domínio estiver no ar.
[vars]
# http:// incluído temporariamente enquanto o certificado HTTPS do GitHub Pages não sai.
# Remover as entradas http:// depois que o Enforce HTTPS estiver ativo.
ALLOWED_ORIGIN = "https://tatianelarios.com.br,https://www.tatianelarios.com.br,http://tatianelarios.com.br,http://www.tatianelarios.com.br,https://luciotav.github.io"
PAGES_ORIGIN   = "https://luciotav.github.io/taty-larios"

# O token é SECRET — não vai aqui. Definir com:
#   cd api && npx wrangler secret put MP_ACCESS_TOKEN
